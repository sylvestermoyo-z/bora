name: bora
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Core language
  - python=3.11

  # Quality control
  - fastqc=0.12.1
  - multiqc=1.21

  # Trimming
  - trim-galore=0.6.10

  # Assembly
  - shovill=1.1.0       # Wrapper around SPAdes, optimised for bacteria
  - spades=3.15.5       # Fallback assembler (also used by Shovill)

  # Assembly quality assessment
  - quast=5.2.0

  # MLST typing
  - mlst=2.23.0

  # AMR detection
  - ncbi-amrfinderplus=3.12.8

  # Species modules (optional but included for one-step install)
  - kleborate=2.3.2
  - ectyper=2.0.0
  - sistr_cmd=1.3.5

  # Utility tools
  - seqkit=2.7.0        # Read statistics and manipulation
  - any2fasta=0.4.2     # FASTA format conversion helper
  - pigz=2.8            # Parallel gzip (speeds up compression steps)

  # Optional modules (installed but disabled by default in config)
  - kraken2=2.1.3       # Taxonomic screening
  - bowtie2=2.5.3       # Host removal

  # Python utilities
  - pandas=2.2.1        # Used in summarize step
  - biopython=1.83
