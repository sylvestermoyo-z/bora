#!/usr/bin/env bash
# =============================================================================
# BORA Configuration File
# Edit this file to match your system before running the pipeline.
# =============================================================================

# --- Compute resources -------------------------------------------------------
THREADS=8           # Number of CPU threads (minimum 4 recommended)
MEMORY_GB=16        # RAM available in GB (minimum 8 GB)

# --- Data location ------------------------------------------------------------
# Path to folder containing your FASTQ files.
#
# Default: "data" (inside the BORA folder — recommended for best performance)
#
# IMPORTANT FOR WSL USERS:
#   Your Windows drives are mounted under /mnt/ in WSL.
#   Common examples — replace with your actual path:
#
#   C: drive folder:
#     DATA_DIR="/mnt/c/Users/Sylvester/Documents/sequencing_data"
#
#   D: drive (common for external/secondary drives):
#     DATA_DIR="/mnt/d/sequencing_data"
#
#   E: drive (USB external drive):
#     DATA_DIR="/mnt/e/bsi_fastq_files"
#
# HOW TO FIND YOUR PATH IN WSL:
#   1. Open WSL terminal
#   2. Type: cd /mnt/c/Users/
#   3. Type: ls   (to see your Windows username folder)
#   4. Navigate to where your FASTQ files are and run: pwd
#   5. Copy that path here
#
# NOTE: Running BORA with DATA_DIR pointing to /mnt/c or /mnt/d is slower
#   than keeping files inside WSL filesystem. For large batches, consider
#   copying FASTQ files into the bora/data/ folder first.
#
DATA_DIR="data"

# Expected FASTQ naming convention:
#   ${DATA_DIR}/${SAMPLE}_R1.fastq.gz
#   ${DATA_DIR}/${SAMPLE}_R2.fastq.gz

# --- Database paths -----------------------------------------------------------
AMRFINDER_DB="db/amrfinderplus"
MLST_DB=""          # Leave blank to use mlst's bundled DB (recommended)

# --- Optional modules ---------------------------------------------------------
# Set to "true" or "false"
ENABLE_KRAKEN2=false          # Taxonomic screening (requires MiniKraken DB ~4GB)
ENABLE_HOST_REMOVAL=false     # Host read removal (requires Bowtie2 host index)
ENABLE_SPECIES_MODULES=true   # Species-specific typing (Kleborate, ECTyper, SISTR)

# Kraken2 DB path (only needed if ENABLE_KRAKEN2=true)
KRAKEN2_DB="db/kraken2"

# Host removal Bowtie2 index (only needed if ENABLE_HOST_REMOVAL=true)
HOST_BT2_INDEX=""
