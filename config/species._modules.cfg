#!/usr/bin/env bash
# =============================================================================
# BORA Species Modules Configuration
# Set each module to "true" or "false" depending on your isolate panel.
# Modules only run if ENABLE_SPECIES_MODULES=true in bora.cfg
# and if the tool is installed in the bora conda environment.
# =============================================================================

# Klebsiella pneumoniae (and related Klebsiella spp.)
# Kleborate: resistance, virulence, ST, capsule typing
KLEBSIELLA_KLEBORATE=true

# Escherichia coli
# ECTyper: O and H serotyping
ECOLI_ECTYPER=true

# Salmonella enterica
# SISTR: serovar prediction
SALMONELLA_SISTR=true

# Staphylococcus aureus
# spaTyper: spa repeat typing
SAUREUS_SPATYPER=false

# Acinetobacter baumannii
# No widely available standalone typer; AMRFinderPlus handles organism-aware AMR.
# Set to true if you have a custom typer installed.
ACINETOBACTER_CUSTOM=false
